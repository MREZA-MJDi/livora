; Livora PHP-FPM pool — separate from other sites on this VPS.
; Install this file as /etc/php/8.5/fpm/pool.d/livora.conf.
; Change the PHP version directory if the installed FPM version differs.

[livora]

user = livora
group = www-data

listen = /run/php/php8.5-fpm-livora.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; On a shared VPS, use ondemand and a conservative worker cap.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500

request_terminate_timeout = 90s
catch_workers_output = yes
decorate_workers_output = no

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 14M
php_admin_value[max_execution_time] = 60
php_admin_value[max_input_time] = 60
