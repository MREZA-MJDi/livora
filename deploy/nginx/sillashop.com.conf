# SilaGallery / Livora — origin vhost (HTTP bootstrap for Certbot)
# PHP-FPM socket is set to PHP 8.5 based on the VPS CLI version observed.
# Verify the actual socket with: ls -1 /run/php/*fpm.sock
# If the socket differs, update fastcgi_pass before enabling this vhost.

server {
    listen 80;
    listen [::]:80;

    server_name sillashop.com www.sillashop.com;

    root /var/www/livora/current/public;
    index index.php;
    charset utf-8;

    client_max_body_size 12m;
    client_body_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Vite emits content-hashed filenames: safe for long-lived immutable caching.
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded product/category/media files have unique generated paths.
    location ^~ /storage/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Public web fonts need CORS when served from the Parspack CDN hostname.
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Other public static files. Do not apply this cache policy to HTML.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Execute only Laravel's front controller; never expose arbitrary PHP files.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm-livora.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 90s;
    }

    location ~ \.php$ {
        return 404;
    }

    # Deny dotfiles (.env, .git, etc.), except ACME challenge files.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
