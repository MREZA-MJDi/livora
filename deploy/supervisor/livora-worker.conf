; Livora queue worker — isolated process and log file.
; Install as /etc/supervisor/conf.d/livora-worker.conf.
; This assumes QUEUE_CONNECTION=database in Livora's shared .env.

[program:livora-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/livora/current/artisan queue:work database --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/var/www/livora/current
user=livora
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=95
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/livora/shared/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
