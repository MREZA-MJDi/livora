name: Livora CI

on:
  push:
    branches:
      - main
      - audit/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: livora-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Laravel tests and storefront smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, gd, curl, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/ci.sqlite

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production frontend assets
        run: npm run build

      - name: Run Laravel feature and unit tests
        env:
          APP_ENV: testing
          APP_DEBUG: "false"
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test

      - name: Verify Laravel production cache commands
        env:
          APP_ENV: testing
          APP_DEBUG: "false"
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan config:cache
          php artisan config:clear
          php artisan route:cache
          php artisan route:clear
          php artisan view:cache
          php artisan view:clear

      - name: Install Playwright for browser smoke tests
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run responsive browser smoke tests
        env:
          APP_ENV: local
          APP_DEBUG: "false"
          DB_CONNECTION: sqlite
          DB_DATABASE: database/ci-browser.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          ADMIN_NAME: "Livora CI Admin"
          ADMIN_EMAIL: "livora-ci-admin@example.test"
          ADMIN_PASSWORD: "livora-ci-test-password-2026"
        run: |
          touch database/ci-browser.sqlite
          php artisan migrate:fresh --force
          php artisan db:seed --force
          npx playwright test

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: livora-browser-smoke-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
