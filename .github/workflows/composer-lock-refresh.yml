name: Temporary Composer lock refresh

on:
  push:
    branches:
      - fix/final-sillashop-domain

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the release candidate branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_sqlite, sqlite3, fileinfo, gd, curl, zip
          coverage: none
          tools: composer:v2

      - name: Update only vulnerable Composer packages and their dependencies
        run: |
          composer update laravel/framework league/commonmark league/flysystem symfony/http-foundation symfony/mime symfony/yaml --with-all-dependencies --no-interaction --prefer-dist

      - name: Validate lockfile and report security audit
        run: |
          composer validate --strict
          if composer audit --locked --no-interaction; then
            echo "Composer audit is clean."
          else
            echo "::warning::Composer audit still reports advisories; the normal pull-request CI remains the release gate."
          fi

      - name: Commit the reviewed Composer lockfile update
        run: |
          if ! git diff --quiet -- composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "fix(deps): update vulnerable Composer packages"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Composer lockfile did not change."
          fi
